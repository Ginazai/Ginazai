name: Metrics

on:
  # Refresh daily
  schedule:
    - cron: "0 0 * * *"
  # Allow manual runs from the Actions tab (do this once after setup)
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

# metrics and wakatime both commit to the default branch; run them one at a time
concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Isometric 3D contribution calendar
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # GitHub achievements (self-generated replacement for the trophy widget)
      # Uses a community fork, not upstream lowlighter/metrics: upstream's achievements
      # plugin still queries GitHub's Projects Classic API, which GitHub has sunset, so
      # it fails with "Unexpected error" on every run. This fork migrated it to Projects V2.
      # https://github.com/EUR-UN/metrics-community/releases
      #
      # IMPORTANT: use the "yuanweize/metrics-community" path, not "EUR-UN/metrics-community".
      # The repo now lives under the EUR-UN org, and that path still resolves via GitHub's
      # redirect, but the action's own build script only recognizes "lowlighter" or
      # "yuanweize" as owners with a prebuilt image on ghcr.io. Any other owner string
      # (including "EUR-UN") is treated as an unrecognized fork and rebuilds the full
      # Docker image from source on every run, which is what timed out.
      - name: Achievements
        if: ${{ success() || failure() }}
        uses: yuanweize/metrics-community@v3.35.0-community.2
        with:
          use_prebuilt_image: yes
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0

      # Languages from the code you actually authored (clones your repos on the runner, so it is slow).
      # Kept last so a timeout here cannot block the steps above.
      - name: Languages (in-depth)
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: lines, bytes-size, percentage
          # Commits are matched to you by GitHub username. If you commit with a different
          # name or email, list them here (comma-separated) or your numbers will be too low:
          # commits_authoring: Your Name, your-username, 12345678+your-username@users.noreply.github.com