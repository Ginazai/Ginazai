name: Generate contribution snake

on:
  # Refresh daily
  schedule:
    - cron: "0 0 * * *"
  # Allow manual runs from the Actions tab (do this once after setup)
  workflow_dispatch:
  # Regenerate when the workflow itself changes
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Builds the snake animation from the contribution graph of the repo owner
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publishes the files to an "output" branch so they never clutter main
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
